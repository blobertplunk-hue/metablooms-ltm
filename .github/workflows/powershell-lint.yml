name: PowerShell Compliance

on:
  push:
    paths:
      - '**.ps1'
      - '**.psm1'
      - '**.psd1'
      - 'powershell/config/PSScriptAnalyzerSettings.psd1'
      - '.github/workflows/powershell-lint.yml'
  pull_request:
    paths:
      - '**.ps1'
      - '**.psm1'
      - '**.psd1'
      - 'powershell/config/PSScriptAnalyzerSettings.psd1'
      - '.github/workflows/powershell-lint.yml'

permissions:
  contents: read

jobs:
  compliance:
    name: PS7 Compliance Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify PowerShell version
        shell: pwsh
        run: |
          $v = $PSVersionTable.PSVersion
          Write-Host "PowerShell $v"
          if ($v.Major -lt 7 -or ($v.Major -eq 7 -and $v.Minor -lt 4)) {
            Write-Error "Requires PowerShell 7.4+. Found: $v"
            exit 1
          }

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          $installed = Get-Module -ListAvailable PSScriptAnalyzer | Select-Object -First 1
          Write-Host "PSScriptAnalyzer $($installed.Version) installed."

      - name: Run compliance check
        shell: pwsh
        run: |
          $result = pwsh -NoProfile -NonInteractive -File `
            ./powershell/scripts/Invoke-PSCompliance.ps1 `
            -Path . `
            -Severity Warning,Error

          exit $LASTEXITCODE

      - name: Upload findings (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pssa-findings
          path: |
            powershell/
          retention-days: 7
